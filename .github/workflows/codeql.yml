name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 4 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build_mode: none
          - language: javascript-typescript
            build_mode: none
          - language: java-kotlin
            build_mode: manual
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.language == 'java-kotlin'
        with:
          gradle-version: '9.6.0'
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended
      - name: Build Kotlin backend for extraction
        if: matrix.language == 'java-kotlin'
        run: gradle classes --no-daemon
        working-directory: backend
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          category: /language:${{ matrix.language }}

