Syslog yes
SyslogSuccess yes
LogWhy yes
Canonicalization relaxed/simple
Mode s
SubDomains no
OversignHeaders From
Domain progmasoft.com
Selector registry
KeyFile /etc/opendkim/keys/progmasoft.com/registry.private
Socket inet:8891@127.0.0.1
PidFile /run/opendkim/opendkim.pid
UMask 007
UserID opendkim:opendkim
RequireSafeKeys yes
