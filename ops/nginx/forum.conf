# This is a standalone informational page, not a forum application.
server {
    listen 80;
    listen [::]:80;
    server_name forum.tala.run;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 308 https://forum.tala.run$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forum.tala.run;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tala.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tala.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # tala.run is closed; see tala.conf.
    return 302 https://tala.run/unavailable?reason=maintenance;
}

