# This is a standalone informational page, not a forum application.
server {
    listen 80;
    listen [::]:80;
    server_name forum.xsharp-lang.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 308 https://forum.xsharp-lang.xyz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forum.xsharp-lang.xyz;
    root /srv/xsharp/website/current/forum;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/forum.xsharp-lang.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.xsharp-lang.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = / { try_files /index.html =404; }
    location = /visual-xsharp.svg { try_files $uri =404; }
    location = /visual-xsharp-mark.svg { try_files $uri =404; }
    location = /site.css { try_files $uri =404; }
    location = /site.js { try_files $uri =404; }
    location / { return 404; }
}
