# tala.run is closed. Every page of tala.run, www.tala.run, talac.tala.run,
# talafmt.tala.run and talalint.tala.run (and forum.tala.run, in forum.conf)
# leads with a temporary redirect to https://tala.run/unavailable?reason=maintenance,
# which answers 503 with a page of its own. The redirect is 302, not 308: the
# domain will serve other pages later, so neither browsers nor Cloudflare may
# keep it. ACME challenges on port 80 still work, so the certificates renew.
# xsharp-lang.xyz, the former domain, still redirects to tala.run, and from
# there to the notice. tazel.tala.run keeps leading to tazel.net, the site of
# Tazel, which goes on.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tala-unmatched.invalid;
    server_tokens off;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name tala.run www.tala.run talac.tala.run tazel.tala.run talafmt.tala.run talalint.tala.run;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tala.run;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tala.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tala.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The notice itself. 503 with Retry-After tells crawlers the closure is
    # temporary and keeps the page out of their index.
    location = /unavailable {
        return 503;
    }

    error_page 503 /tala-unavailable.html;
    location = /tala-unavailable.html {
        internal;
        alias /usr/share/nginx/html/maintenance/tala-unavailable.html;
        default_type text/html;
        add_header Retry-After "86400" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location / {
        return 302 https://tala.run/unavailable?reason=maintenance;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tala.run talac.tala.run talafmt.tala.run talalint.tala.run;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tala.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tala.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 302 https://tala.run/unavailable?reason=maintenance;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tazel.tala.run;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tala.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tala.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # The two pages of the old site have their own pages on tazel.net; any
    # other page of its docs goes to the docs, everything else to the same path.
    location ~ "^/docs/(commands|project-file)/?$" {
        return 308 https://tazel.net/docs/reference/$1$is_args$args;
    }

    location /docs/ {
        return 308 https://tazel.net/docs;
    }

    location / {
        return 308 https://tazel.net$request_uri;
    }
}

# The former domain. Every path keeps working and lands on the same path of
# tala.run.
server {
    listen 80;
    listen [::]:80;
    server_name xsharp-lang.xyz www.xsharp-lang.xyz docs.xsharp-lang.xyz spec.xsharp-lang.xyz;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://tala.run$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xsharp-lang.xyz www.xsharp-lang.xyz docs.xsharp-lang.xyz spec.xsharp-lang.xyz;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/xsharp-lang.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xsharp-lang.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 308 https://tala.run$request_uri;
}

