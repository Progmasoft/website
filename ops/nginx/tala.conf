# The former domain. Every path keeps working and lands on the same path of
# tala.run.
server {
    listen 80;
    listen [::]:80;
    server_name xsharp-lang.xyz www.xsharp-lang.xyz docs.xsharp-lang.xyz spec.xsharp-lang.xyz;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://tala.run$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xsharp-lang.xyz www.xsharp-lang.xyz docs.xsharp-lang.xyz spec.xsharp-lang.xyz;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/xsharp-lang.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xsharp-lang.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 308 https://tala.run$request_uri;
}

# The registry moved to Progmasoft before the rename; its former address keeps
# pointing there. tala.run has no ViGet host of its own.
